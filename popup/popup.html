<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Radar Cen — Ustawienia</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <!-- Header -->
    <header class="popup-header">
      <img
        src="../icons/icon-48.png"
        alt="Logo Radar Cen"
        class="popup-logo"
        onerror="this.style.display = 'none'"
      />
      <div>
        <h1 class="popup-title">Radar Cen</h1>
        <p class="popup-subtitle">Ustawienia rozszerzenia</p>
      </div>
    </header>

    <!-- Save confirmation banner -->
    <div
      id="saved-banner"
      class="banner banner--hidden"
      role="status"
      aria-live="polite"
    >
      ✓ Zapisano ustawienia
    </div>

    <!-- Settings form -->
    <form id="settings-form" novalidate>
      <!-- General -->
      <section class="section">
        <h2 class="section-title">Ogólne</h2>

        <label class="toggle-row">
          <span class="label-text">Włącz rozszerzenie</span>
          <div class="toggle-wrap">
            <input type="checkbox" id="enabled" name="enabled" role="switch" />
            <span class="toggle-track"></span>
          </div>
        </label>

        <label class="toggle-row">
          <span class="label-text">
            Tryb debugowania
            <small class="hint">Logi w konsoli przeglądarki</small>
          </span>
          <div class="toggle-wrap">
            <input type="checkbox" id="debug" name="debug" role="switch" />
            <span class="toggle-track"></span>
          </div>
        </label>
      </section>

      <!-- Price thredholds -->
      <section class="section">
        <h2 class="section-title">Progi cenowe</h2>

        <div class="field">
          <label class="field-label" for="thresholdBest">
            Próg „historyczne minimum" (%)
            <small class="hint">Cena ≤ X% powyżej min. → zielona odznaka</small>
          </label>
          <input
            class="field-input"
            type="number"
            id="thresholdBest"
            name="thresholdBest"
            min="0"
            max="10"
            step="0.1"
          />
        </div>

        <div class="field">
          <label class="field-label" for="thresholdGood">
            Próg „dobra cena" (%)
            <small class="hint">Cena ≤ X% powyżej min. → żółta odznaka</small>
          </label>
          <input
            class="field-input"
            type="number"
            id="thresholdGood"
            name="thresholdGood"
            min="0"
            max="50"
            step="0.5"
          />
        </div>
      </section>

      <!-- Cache -->
      <section class="section">
        <h2 class="section-title">Cache</h2>

        <div class="field">
          <label class="field-label" for="cacheTTL">
            Czas życia cache (godziny)
            <small class="hint">Po tym czasie dane są pobierane ponownie</small>
          </label>
          <input
            class="field-input"
            type="number"
            id="cacheTTL"
            name="cacheTTL"
            min="1"
            max="168"
            step="1"
          />
        </div>

        <div class="field">
          <label class="field-label" for="cacheMaxSize">
            Maks. rozmiar cache (wpisy)
          </label>
          <input
            class="field-input"
            type="number"
            id="cacheMaxSize"
            name="cacheMaxSize"
            min="10"
            max="1000"
            step="10"
          />
        </div>

        <button type="button" id="clear-cache-btn" class="btn btn--secondary">
          🗑 Wyczyść cache
        </button>
      </section>

      <!-- API requests -->
      <section class="section">
        <h2 class="section-title">Żądania API</h2>

        <div class="field">
          <label class="field-label" for="minDelay">
            Minimalne opóźnienie między żądaniami (ms)
          </label>
          <input
            class="field-input"
            type="number"
            id="minDelay"
            name="minDelay"
            min="100"
            max="5000"
            step="100"
          />
        </div>

        <div class="field">
          <label class="field-label" for="maxDelay">
            Maksymalne opóźnienie między żądaniami (ms)
          </label>
          <input
            class="field-input"
            type="number"
            id="maxDelay"
            name="maxDelay"
            min="100"
            max="10000"
            step="100"
          />
        </div>

        <div class="field">
          <label class="field-label" for="apiTimeout">
            Timeout żądania API (ms)
          </label>
          <input
            class="field-input"
            type="number"
            id="apiTimeout"
            name="apiTimeout"
            min="1000"
            max="30000"
            step="500"
          />
        </div>
      </section>

      <!-- Action buttons -->
      <div class="actions">
        <button type="button" id="reset-btn" class="btn btn--secondary">
          Przywróć domyślne
        </button>
        <button type="submit" id="save-btn" class="btn btn--primary">
          Zapisz
        </button>
      </div>
    </form>

    <!-- Footer -->
    <footer class="popup-footer">Radar Cen v0.1.0</footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
